[package]
name = "hitec"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Brian Li"]
license = "MIT"
description = "A template designed for use for documentation in high-technology companies. A typst rework of the LaTex `hitec` package."
repository = "https://github.com/ShabbyGayBar/hitec"
keywords = ["technology", "report"]
categories = ["report"]
exclude = ["documentation"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"